name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete project record
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate calendar records
        run: bash tools/validate-history.sh
