# Same commands as a typical local check: SKIP_TESTS_RUN=1 ./tools/smoke-check.sh && ./tests/run.sh
# Optional shellcheck / markdownlint are not installed here so behavior matches a machine that has not
# run `brew bundle` (smoke-check skips those with a warn when not on PATH, same as local).
# Linux installs zsh (not on ubuntu-latest by default) so zsh -n checks run.
# macOS runs Swift picker parse when swiftc is available; Ubuntu skips that step.
name: Smoke check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CURSOR_CONFIG_ROOT: ${{ github.workspace }}/cursor
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest has bash but not zsh; tools/smoke-check.sh uses zsh -n for launcher/zshrc.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run smoke-check.sh
        run: SKIP_TESTS_RUN=1 ./tools/smoke-check.sh

      - name: Run tests suite
        run: ./tests/run.sh
