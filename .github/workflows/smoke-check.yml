# Runs tools/smoke-check.sh on push and PR.
# Linux installs zsh (not on ubuntu-latest by default) so zsh -n checks run.
# macOS runs Swift picker parse when swiftc is available; Ubuntu skips that step.
# shellcheck (apt/brew) and markdownlint-cli (npm) are installed so smoke-check runs those branches too.
name: Smoke check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CURSOR_CONFIG_ROOT: ${{ github.workspace }}/cursor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      # ubuntu-latest has bash but not zsh; tools/smoke-check.sh uses zsh -n for launcher/zshrc.
      - name: Install zsh and shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Run smoke-check.sh
        run: ./tools/smoke-check.sh
